name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - name: Offline unit and generated-data SQL smoke
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - name: Recompute archived synthetic evidence
        run: |
          python scripts/restore_audit_evidence.py
          PYTHONPATH=. python scripts/audit_site_numbers.py
          PYTHONPATH=. python scripts/site_ablation.py
