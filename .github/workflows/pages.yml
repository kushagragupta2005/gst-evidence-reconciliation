name: Deploy static site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # This repository has no pre-existing Pages site. Enable the
          # GitHub Actions deployment source on its first deployment.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed snapshot with Playwright
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run site:smoke -- --url "$SITE_URL" --report reports/pages_browser_smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-browser-smoke
          path: reports/pages_browser_smoke.json
